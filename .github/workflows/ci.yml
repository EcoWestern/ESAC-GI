name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.6 is the minimum supported version (native TypeScript stripping).
        node: ["22.x", "24.x"]
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Harness self-test
        run: npm run esac -- selftest

  public-pool:
    name: Public pool is reproducible
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # The public repository is the distributable artifact, so the committed
      # snapshot must be exactly what the generators produce today. If this step
      # fails, regenerate it with: npm run export:public
      - name: Regenerate the public pool and compare
        run: |
          npm run esac -- export --split public --out runs/public-check.jsonl
          diff -u public/esac-gi-v1.0-public.jsonl runs/public-check.jsonl
